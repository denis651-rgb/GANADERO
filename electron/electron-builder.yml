appId: bo.com.ganadero.desktop
productName: Ganadero
copyright: Copyright © Ganadero

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - package.json

extraResources:
  - from: ../frontend-web/dist
    to: frontend
  - from: ../backend/target/ganadero-backend-1.0.0.jar
    to: backend/ganadero-backend.jar
  - from: runtime
    to: jre

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

# "npm run release" publica el instalador + los metadatos que electron-updater necesita
# (latest.yml) como GitHub Release del propio repo. Requiere GH_TOKEN al publicar; los clientes
# solo LEEN releases públicas, sin token (ver electron/src/updater.ts).
publish:
  provider: github
  owner: denis651-rgb
  repo: GANADERO
