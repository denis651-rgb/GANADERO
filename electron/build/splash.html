<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="color-scheme" content="light dark" />
<title>Ganadero</title>
<style>
  :root {
    --green-900: #123d2a;
    --green-800: #195436;
    --green-700: #1f6a45;
    --green-600: #287b52;
    --green-100: #dceee3;
    --green-50: #edf7f1;
    --ink: #1c2b22;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
  body {
    background: transparent;
    font-family: 'Public Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  .splash {
    position: absolute;
    inset: 10px;
    border-radius: 22px;
    background: linear-gradient(150deg, var(--green-900) 0%, var(--green-800) 48%, var(--green-700) 100%);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    box-shadow:
      0 24px 60px rgba(9, 32, 22, 0.42),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
    animation: splash-in 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .splash::before {
    content: "";
    position: absolute;
    top: -120px;
    left: 50%;
    transform: translateX(-50%);
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(220, 238, 227, 0.14), transparent 70%);
    pointer-events: none;
  }
  .splash::after {
    content: "";
    position: absolute;
    right: -140px;
    bottom: -140px;
    width: 360px;
    height: 360px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(40, 123, 82, 0.55), transparent 70%);
    pointer-events: none;
  }
  .logo-wrapper {
    position: relative;
    width: 108px;
    height: 108px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.14);
    display: grid;
    place-items: center;
    box-shadow: 0 10px 28px rgba(9, 32, 22, 0.35);
  }
  .logo-wrapper img {
    width: 76px;
    height: 76px;
    object-fit: contain;
  }
  .wordmark {
    margin-top: 22px;
    font-family: 'Newsreader', Georgia, 'Times New Roman', serif;
    font-weight: 600;
    font-size: 40px;
    letter-spacing: 0.05em;
    line-height: 1;
    text-shadow: 0 2px 12px rgba(9, 32, 22, 0.45);
  }
  .tagline {
    margin-top: 8px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.72);
  }
  .loader {
    margin-top: 38px;
    width: 208px;
    height: 6px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.16);
    overflow: hidden;
    position: relative;
  }
  .loader-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 3%;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--green-100), #ffffff);
    overflow: hidden;
    /* Avanza rápido al inicio y se frena cerca del final: nunca llega al 100%
       porque el splash se cierra cuando la app está lista. */
    animation: loader-progress 16s linear forwards;
  }
  .loader-fill::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(31, 106, 69, 0.28), transparent);
    transform: translateX(-100%);
    animation: loader-shimmer 1.3s ease-in-out infinite;
  }
  .loader-label {
    margin-top: 12px;
    font-size: 12.5px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: rgba(255, 255, 255, 0.66);
  }
  .loader-label::after {
    content: "";
    animation: dots 1.6s steps(4, end) infinite;
  }
  @keyframes splash-in {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes loader-progress {
    0% { width: 3%; animation-timing-function: cubic-bezier(0.2, 0.7, 0.3, 1); }
    18% { width: 42%; animation-timing-function: cubic-bezier(0.3, 0.6, 0.4, 1); }
    45% { width: 70%; animation-timing-function: cubic-bezier(0.3, 0.6, 0.4, 1); }
    75% { width: 86%; animation-timing-function: ease-out; }
    100% { width: 94%; }
  }
  @keyframes loader-shimmer {
    to { transform: translateX(100%); }
  }
  @keyframes dots {
    0% { content: ""; }
    25% { content: "."; }
    50% { content: ".."; }
    75% { content: "..."; }
  }
  @media (prefers-reduced-motion: reduce) {
    .splash { animation: none; }
    /* El avance de la barra es información de estado, se conserva; solo se quita el brillo. */
    .loader-fill::after { animation: none; display: none; }
    .loader-label::after { animation: none; content: "..."; }
  }
</style>
</head>
<body>
  <main class="splash">
    <div class="logo-wrapper"><img src="./logo.png" alt="" width="76" height="76" /></div>
    <h1 class="wordmark">GANADERO</h1>
    <p class="tagline">Gestión de campo</p>
    <div class="loader"><div class="loader-fill"></div></div>
    <p class="loader-label">Iniciando</p>
  </main>
</body>
</html>
