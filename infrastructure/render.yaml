services:
  - type: web
    name: ganadero-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWKS_URI
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: ganadero-private
      - key: APP_FRONTEND_URL
        sync: false
      - key: APP_BOOTSTRAP_ENABLED
        value: false
      - key: APP_BOOTSTRAP_TOKEN
        sync: false
      - key: APP_SYSTEM_STATUS_ENABLED
        value: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: APP_QR_SIGNING_SECRET
        sync: false
      - key: JAVA_TOOL_OPTIONS
        value: -Xms96m -Xmx320m -XX:MaxMetaspaceSize=128m

