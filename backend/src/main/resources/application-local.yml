spring:
  datasource:
    url: jdbc:sqlite:${GANADERO_DB_PATH:./data/ganadero.db}?foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      connection-timeout: 30000
  jpa:
    show-sql: false
    hibernate:
      # sqlite-jdbc genera un SELECT compuesto para introspeccionar columnas de
      # todas las tablas a la vez (getColumns con patron "%") y choca con el
      # limite de terminos de SQLite cuando hay ~30+ tablas. "validate" no es
      # viable con este driver; se confia en el baseline de Flyway como fuente
      # de verdad del esquema.
      ddl-auto: none
  flyway:
    locations: classpath:db/migration,classpath:db/local

app:
  security:
    enabled: false
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://192.168.100.63:5173
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:false}
    token: ${APP_BOOTSTRAP_TOKEN:local-bootstrap-change-me}
  internal-jobs:
    enabled: ${APP_INTERNAL_JOBS_ENABLED:false}
    secret: ${GANADERO_CRON_SECRET:local-cron-secret-change-me}
  system-status:
    enabled: ${APP_SYSTEM_STATUS_ENABLED:true}
  qr:
    signing-secret: local-qr-signing-secret-change-me
