spring:
  application:
    name: ganadero-backend
  profiles:
    default: local
  datasource:
    url: jdbc:sqlite:${GANADERO_DB_PATH:./data/ganadero.db}?foreign_keys=on
    driver-class-name: org.sqlite.JDBC
  jpa:
    open-in-view: false
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # V27 necesita `pragma foreign_keys=off/on` alrededor de una recreación de tabla con datos
    # reales referenciándola (ver comentario en V27); SQLite trata PRAGMA como no-transaccional,
    # y Flyway rechaza mezclar eso con DDL/DML transaccional salvo `mixed: true`.
    mixed: true

server:
  address: 127.0.0.1
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

ganadero:
  alertas:
    scheduler:
      enabled: ${GANADERO_ALERTAS_SCHEDULER_ENABLED:true}
    cron-activar: ${GANADERO_ALERTAS_CRON_ACTIVAR:0 */5 * * * *}
    cron-enviar: ${GANADERO_ALERTAS_CRON_ENVIAR:0 */5 * * * *}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:false}
    token: ${APP_BOOTSTRAP_TOKEN:}
  internal-jobs:
    enabled: ${APP_INTERNAL_JOBS_ENABLED:false}
    secret: ${GANADERO_CRON_SECRET:}
  qr:
    signing-secret: ${APP_QR_SIGNING_SECRET:}
    payload-version: ${APP_QR_PAYLOAD_VERSION:1}
    max-payload-bytes: ${APP_QR_MAX_PAYLOAD_BYTES:2048}
    resolver-rate-limit-per-minute: ${APP_QR_RESOLVER_RATE_LIMIT_PER_MINUTE:20}
  system-status:
    enabled: ${APP_SYSTEM_STATUS_ENABLED:false}
  storage:
    root-path: ${GANADERO_MEDIA_PATH:./data/media}
    max-bytes: ${APP_STORAGE_MAX_BYTES:5242880}
    allowed-mime-types: image/jpeg,image/png,image/webp
    allowed-extensions: jpg,jpeg,png,webp

info:
  app:
    name: GANADERO
    architecture: modular-monolith
    version: 1.0.0
