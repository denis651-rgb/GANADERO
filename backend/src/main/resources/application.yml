spring:
  application:
    name: ganadero-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

ganadero:
  push:
    enabled: ${GANADERO_PUSH_ENABLED:false}
    vapid-public-key: ${GANADERO_PUSH_VAPID_PUBLIC_KEY:}
    vapid-private-key: ${GANADERO_PUSH_VAPID_PRIVATE_KEY:}
    subject: ${GANADERO_PUSH_SUBJECT:mailto:soporte@ganadero.bo}
    max-attempts: ${GANADERO_PUSH_MAX_ATTEMPTS:5}
    ttl-seconds: ${GANADERO_PUSH_TTL_SECONDS:604800}
  alertas:
    scheduler:
      enabled: ${GANADERO_ALERTAS_SCHEDULER_ENABLED:true}
    cron-activar: ${GANADERO_ALERTAS_CRON_ACTIVAR:0 */5 * * * *}
    cron-enviar: ${GANADERO_ALERTAS_CRON_ENVIAR:0 */5 * * * *}

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:false}
    token: ${APP_BOOTSTRAP_TOKEN:}
  internal-jobs:
    enabled: ${APP_INTERNAL_JOBS_ENABLED:false}
    secret: ${GANADERO_CRON_SECRET:}
  invitations:
    expiration-hours: ${APP_INVITATION_EXPIRATION_HOURS:72}
    max-resend-attempts: ${APP_INVITATION_MAX_RESEND_ATTEMPTS:5}
  qr:
    signing-secret: ${APP_QR_SIGNING_SECRET:}
    payload-version: ${APP_QR_PAYLOAD_VERSION:1}
    max-payload-bytes: ${APP_QR_MAX_PAYLOAD_BYTES:2048}
    resolver-rate-limit-per-minute: ${APP_QR_RESOLVER_RATE_LIMIT_PER_MINUTE:20}
  system-status:
    enabled: ${APP_SYSTEM_STATUS_ENABLED:false}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:ganadero-private}
    max-bytes: ${APP_STORAGE_MAX_BYTES:5242880}
    signed-url-ttl: ${APP_STORAGE_SIGNED_URL_TTL:PT10M}
    allowed-mime-types: image/jpeg,image/png,image/webp
    allowed-extensions: jpg,jpeg,png,webp

info:
  app:
    name: GANADERO
    architecture: modular-monolith
    version: 0.0.1-SNAPSHOT
