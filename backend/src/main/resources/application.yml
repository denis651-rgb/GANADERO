spring:
  application:
    name: ganadero-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:false}
    token: ${APP_BOOTSTRAP_TOKEN:}
  system-status:
    enabled: ${APP_SYSTEM_STATUS_ENABLED:false}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:ganadero-private}
    max-bytes: ${APP_STORAGE_MAX_BYTES:5242880}
    signed-url-ttl: ${APP_STORAGE_SIGNED_URL_TTL:PT10M}
    allowed-mime-types: image/jpeg,image/png,image/webp
    allowed-extensions: jpg,jpeg,png,webp

info:
  app:
    name: GANADERO
    architecture: modular-monolith
    version: 0.0.1-SNAPSHOT
