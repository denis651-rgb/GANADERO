spring:
  application:
    name: ganadero-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  info:
    env:
      enabled: false

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  bootstrap:
    enabled: ${APP_BOOTSTRAP_ENABLED:false}
    token: ${APP_BOOTSTRAP_TOKEN:}
  invitations:
    expiration-hours: ${APP_INVITATION_EXPIRATION_HOURS:72}
    max-resend-attempts: ${APP_INVITATION_MAX_RESEND_ATTEMPTS:5}
  qr:
    signing-secret: ${APP_QR_SIGNING_SECRET:}
    payload-version: ${APP_QR_PAYLOAD_VERSION:1}
    max-payload-bytes: ${APP_QR_MAX_PAYLOAD_BYTES:2048}
    resolver-rate-limit-per-minute: ${APP_QR_RESOLVER_RATE_LIMIT_PER_MINUTE:20}
  system-status:
    enabled: ${APP_SYSTEM_STATUS_ENABLED:false}
  storage:
    bucket: ${SUPABASE_STORAGE_BUCKET:ganadero-private}
    max-bytes: ${APP_STORAGE_MAX_BYTES:5242880}
    signed-url-ttl: ${APP_STORAGE_SIGNED_URL_TTL:PT10M}
    allowed-mime-types: image/jpeg,image/png,image/webp
    allowed-extensions: jpg,jpeg,png,webp

info:
  app:
    name: GANADERO
    architecture: modular-monolith
    version: 0.0.1-SNAPSHOT
