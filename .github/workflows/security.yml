name: Security

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Bloquear archivos de entorno privados
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.(local|[^/]*\.local)$)'; then
            echo "Se encontraron archivos de entorno privados versionados"
            exit 1
          fi

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend-web/.node-version
          cache: npm
          cache-dependency-path: frontend-web/package-lock.json
      - name: Auditar dependencias frontend
        working-directory: frontend-web
        run: |
          npm audit --json > npm-audit.json || true
          node scripts/check-audit.mjs npm-audit.json
      - name: Verificar árbol Maven
        working-directory: backend
        run: ./mvnw -B dependency:tree
